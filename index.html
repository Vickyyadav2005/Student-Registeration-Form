<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-shape shape-one"></div>
    <div class="background-shape shape-two"></div>
    <div class="background-shape shape-three"></div>
    <div class="background-shape shape-four"></div>

    <div class="page">

        <div class="register-card">

            <div class="heading">

                <div class="college-icon">
                    🎓
                </div>

                <h1>Student Registration</h1>

                <p id="welcomeText">
                    Create your student account
                </p>

            </div>

            <form id="studentForm">

                <div class="field">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                    >

                    <span id="nameMessage"></span>

                </div>

                <div class="field">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >

                    <span id="emailMessage"></span>

                </div>

                <div class="field">

                    <label for="mobile">
                        Mobile Number
                    </label>

                    <input
                        type="text"
                        id="mobile"
                        maxlength="10"
                        placeholder="Enter 10 digit mobile number"
                    >

                    <span id="mobileMessage"></span>

                </div>

                <div class="field">

                    <label for="branch">
                        Branch
                    </label>

                    <select id="branch">

                        <option value="">
                            Select your branch
                        </option>

                        <option value="CSE">
                            Computer Science Engineering
                        </option>

                        <option value="IT">
                            Information Technology
                        </option>

                        <option value="ECE">
                            Electronics & Communication
                        </option>

                        <option value="EEE">
                            Electrical Engineering
                        </option>

                        <option value="ME">
                            Mechanical Engineering
                        </option>

                        <option value="CE">
                            Civil Engineering
                        </option>

                    </select>

                    <span id="branchMessage"></span>

                </div>

                <div class="field">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                        >

                        <button
                            type="button"
                            id="showPassword"
                        >
                            Show
                        </button>

                    </div>

                    <div class="strength">
                        <div id="strengthBar"></div>
                    </div>

                    <span id="passwordMessage"></span>

                </div>

                <button
                    type="submit"
                    class="register-button"
                >
                    Register Now
                </button>

            </form>

            <div id="result"></div>

        </div>

    </div>

    <script src="student.js"></script>
    <script src="test.js"></script>
    <script src="script.js"></script>

</body>
</html>
